name: iOS TestFlight

# 저장소 Actions 탭에서 "Run workflow"를 누르면 아이폰 앱을 빌드해 TestFlight에 올립니다.
# 필요한 저장소 Secrets (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID      : App Store Connect API 키 ID (예: 6KD6WY3L7U)
#   ASC_KEY_P8      : API 키 파일(AuthKey_XXXX.p8) 내용 전체
#   (선택) APPLE_TEAM_ID / ASC_ISSUER_ID : 없으면 아래 기본값 사용
on:
  workflow_dispatch:
  push:
    tags: ["ios-*"]
    # ios/release.txt 내용을 바꿔서 올려도 실행됨 (태그를 못 올리는 환경용)
    branches: [main]
    paths: ["ios/release.txt"]

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # 팀 ID·Issuer ID는 비밀값이 아니라서 기본값을 여기 적어 둡니다 (Secrets가 있으면 그쪽이 우선).
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID || '4CPCVRQ9S6' }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || '4033414f-5663-4ab7-b529-319b71f41e87' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          for v in TEAM_ID ASC_KEY_ID ASC_ISSUER_ID; do
            if [ -z "${!v}" ]; then echo "::error::Secret for $v is missing"; exit 1; fi
          done
          if [ "${{ secrets.ASC_KEY_P8 != '' }}" != "true" ]; then echo "::error::Secret ASC_KEY_P8 is missing"; exit 1; fi

      - name: Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare game file and versions
        run: |
          cp index.html ios/Resources/index.html
          WEB_BUILD=$(grep -o 'WEB_BUILD=[0-9]*' index.html | head -1 | cut -d= -f2)
          WEB_NAME=$(grep -o "WEB_NAME='[0-9.]*'" index.html | head -1 | cut -d"'" -f2)
          echo "WEB_BUILD=$WEB_BUILD" >> $GITHUB_ENV
          echo "WEB_NAME=$WEB_NAME" >> $GITHUB_ENV
          echo "Game build $WEB_BUILD / version $WEB_NAME / iOS build ${{ github.run_number }}"

      - name: API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" >> $GITHUB_ENV

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Archive (unsigned)
        working-directory: ios
        # 기기 등록 없이 하기 위해 아카이브는 서명 없이 만들고,
        # 다음 단계(내보내기)에서 API 키로 애플 클라우드 배포 서명을 받습니다.
        run: |
          set -o pipefail
          xcodebuild -project KX1000.xcodeproj -scheme KX1000 -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/KX1000.xcarchive" archive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$WEB_NAME" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            KX_BUNDLED_BUILD="$WEB_BUILD" 2>&1 | tee "$RUNNER_TEMP/archive.log" | tail -30 \
          || { grep -E "error:|rror " "$RUNNER_TEMP/archive.log" | head -15 | sed 's/^/::error::/'; exit 1; }

      - name: Export and upload to TestFlight
        working-directory: ios
        run: |
          sed "s/TEAM_ID_PLACEHOLDER/$TEAM_ID/" ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/KX1000.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/export.log" | tail -40 \
          || { grep -iE "error|fail" "$RUNNER_TEMP/export.log" | head -15 | sed 's/^/::error::/'; exit 1; }
          echo "Uploaded. It appears in App Store Connect → TestFlight after processing (about 5-15 min)."
